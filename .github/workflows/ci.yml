name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    uses: UniFormat/.github/.github/workflows/rust-ci.yml@95bbdd08c862243584a2366d2e69b7ab3a4ae656
    with:
      repo: uniformat-sas
      siblings: uniformat-core uniformat-conformance
      sibling-refs: '{"uniformat-core": "4075555dcf669e3c598c871ce280dda5ffc92234", "uniformat-conformance": "b75d53f3c0523b20500200083637f74aa1a702b9"}'
      extra-args: --exclude uniformat-sas-py
    secrets:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}
  python:
    uses: UniFormat/.github/.github/workflows/python-ci.yml@95bbdd08c862243584a2366d2e69b7ab3a4ae656
    with:
      repo: uniformat-sas
      project-dir: bindings/python
      siblings: uniformat-core uniformat-conformance
      sibling-refs: '{"uniformat-core": "4075555dcf669e3c598c871ce280dda5ffc92234", "uniformat-conformance": "b75d53f3c0523b20500200083637f74aa1a702b9"}'
      native: true
    secrets:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}
  r:
    uses: UniFormat/.github/.github/workflows/r-ci.yml@95bbdd08c862243584a2366d2e69b7ab3a4ae656
    with:
      repo: uniformat-sas
      package-dir: bindings/r/rpkg
      siblings: uniformat-core uniformat-conformance
      sibling-refs: '{"uniformat-core": "4075555dcf669e3c598c871ce280dda5ffc92234", "uniformat-conformance": "b75d53f3c0523b20500200083637f74aa1a702b9"}'
    secrets:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}
