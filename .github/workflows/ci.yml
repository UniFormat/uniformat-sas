name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    uses: UniFormat/.github/.github/workflows/rust-ci.yml@d3d2936bdfedc251a7099d73c9496dbdb33c9dc2
    with:
      repo: uniformat-sas
      siblings: uniformat-core uniformat-conformance
      sibling-refs: '{"uniformat-core": "5afd0cf15c22c82ef0cf1bf0fecdb54cd0e2abd9", "uniformat-conformance": "f060db8122e642e9fb2950d3bdbf4e6a8a19da07"}'
      extra-args: --exclude uniformat-sas-py
    secrets:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}
  python:
    uses: UniFormat/.github/.github/workflows/python-ci.yml@d3d2936bdfedc251a7099d73c9496dbdb33c9dc2
    with:
      repo: uniformat-sas
      project-dir: bindings/python
      siblings: uniformat-core uniformat-conformance
      sibling-refs: '{"uniformat-core": "5afd0cf15c22c82ef0cf1bf0fecdb54cd0e2abd9", "uniformat-conformance": "f060db8122e642e9fb2950d3bdbf4e6a8a19da07"}'
      native: true
    secrets:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}
  r:
    uses: UniFormat/.github/.github/workflows/r-ci.yml@d3d2936bdfedc251a7099d73c9496dbdb33c9dc2
    with:
      repo: uniformat-sas
      package-dir: bindings/r/rpkg
      siblings: uniformat-core uniformat-conformance
      sibling-refs: '{"uniformat-core": "5afd0cf15c22c82ef0cf1bf0fecdb54cd0e2abd9", "uniformat-conformance": "f060db8122e642e9fb2950d3bdbf4e6a8a19da07"}'
    secrets:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}
