name: release
# Build artifacts only; publication to registries remains manual.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  wheels:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: uniformat-sas
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniFormat/uniformat-core
          ref: 4075555dcf669e3c598c871ce280dda5ffc92234
          path: uniformat-core
          token: ${{ secrets.CI_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniFormat/uniformat-conformance
          ref: b75d53f3c0523b20500200083637f74aa1a702b9
          path: uniformat-conformance
          token: ${{ secrets.CI_TOKEN || github.token }}
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          working-directory: uniformat-sas/bindings/python
          args: --locked --release --out dist
          manylinux: auto
          maturin-version: "1.16.0"
          rust-toolchain: "1.99.1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wheels-${{ matrix.os }}
          path: uniformat-sas/bindings/python/dist/*.whl
