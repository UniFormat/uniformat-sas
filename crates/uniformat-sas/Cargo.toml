[package]
name = "uniformat-sas"
description = "Cœur sans I/O du driver sas7bdat : analyse et écriture du format à partir d'octets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
encoding_rs = { workspace = true }
memchr = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
uniformat-testkit = { workspace = true }

# ADR 0007 §1 : lints de production du cœur (aucune panique sur entrée invalide).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
panic = "deny"
