[package]
name = "uniformat-sas-py"
description = "Liaison Python (PyO3), non publiée sur crates.io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
uniformat-sas = { workspace = true }
uniformat-sas-io = { workspace = true }
uniformat-sas-arrow = { workspace = true }
arrow-array = "59.2"
arrow-schema = "59.2"
pyo3 = { version = "0.30", features = ["abi3-py39"] }
pyo3-arrow = { version = "0.20", default-features = false }

[lints]
workspace = true
