# ADR 0007 §4 : aucune licence copyleft forte dans le graphe de production.
[graph]
all-features = true
# Les dépendances de test sont aussi auditées : un outil CI vulnérable fait partie du périmètre.
exclude-dev = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Dédicace au domaine public (tiny-keccak, via arrow-array → ahash → const-random) : permissive, sans copyleft.
    "CC0-1.0",
    # rust-numpy (dépendance de pyo3-arrow, liaison Python) : BSD-2-Clause, permissive.
    "BSD-2-Clause",
]
confidence-threshold = 0.9
# Trust-anchor data distributed by the TLS verifier, not a relicensing of our code.
exceptions = [
    { crate = "webpki-root-certs@1.0.11", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Dépendances par chemin entre crates du workspace (jamais publiées en l'état : publish = false).
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
# paste reste signalé comme non maintenu via extendr 0.9 ; aucun avis n'est masqué.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
